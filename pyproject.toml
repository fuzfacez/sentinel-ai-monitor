[project]
name = "sentinel-ai"
version = "1.0.0"
description = "Self-hosted website monitoring with AI incident analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.9",
  "alembic==1.16.5",
  "apscheduler==3.11.0",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "aiosqlite==0.21.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
